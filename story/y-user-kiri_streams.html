<!doctype html>
<html lang="ja">
  <head>

    <style>
      body { margin: 0; font-family: "Noto Sans JP", system-ui, sans-serif; background:#f7f9f9; color:#0f1419; }
      .wrap { max-width: 620px; margin: 0 auto; background:#fff; min-height:100vh; border-left:1px solid #eff3f4; border-right:1px solid #eff3f4; }

      .id { color:#536471; font-size:14px; margin-top:2px; }
      .note { color:#536471; font-size:13px; margin-top:8px; }
      .post { display:flex; gap:12px; padding:14px 16px; border-bottom:1px solid #eff3f4; }
